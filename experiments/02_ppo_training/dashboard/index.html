<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Training Dashboard</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Vanilla CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="title-section">
                <h1>Pokémon TCG RL Training</h1>
                <p class="subtitle">Real-time PPO metrics dashboard</p>
            </div>
            <div class="status-section">
                <div class="status-indicator">
                    <span class="dot pulse"></span>
                    <span id="connection-status">Live</span>
                </div>
                <div class="metrics-summary">
                    <div class="summary-card">
                        <span class="label">Total Steps</span>
                        <span class="value" id="summary-steps">--</span>
                    </div>
                    <div class="summary-card">
                        <span class="label">Update Count</span>
                        <span class="value" id="summary-update">--</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Row 1 -->
            <div class="card chart-card">
                <h2>Win Rate vs Opponent (Raw)</h2>
                <div class="chart-container">
                    <canvas id="winRateChart"></canvas>
                </div>
            </div>
            
            <div class="card chart-card">
                <h2>Smoothed Win Rate (Moving Avg)</h2>
                <div class="chart-container">
                    <canvas id="smoothedWinRateChart"></canvas>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="card chart-card">
                <h2>Overall Average Win Rate</h2>
                <div class="chart-container">
                    <canvas id="avgWinRateChart"></canvas>
                </div>
            </div>
            
            <div class="card chart-card">
                <h2>Average Reward</h2>
                <div class="chart-container">
                    <canvas id="rewardChart"></canvas>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="card chart-card">
                <h2>Episode Length</h2>
                <div class="chart-container">
                    <canvas id="lengthChart"></canvas>
                </div>
            </div>

            <div class="card chart-card">
                <h2>Actor / Critic Loss & Entropy</h2>
                <div class="chart-container">
                    <canvas id="lossChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Vanilla JS logic -->
    <script src="/static/script.js"></script>
</body>
</html>
